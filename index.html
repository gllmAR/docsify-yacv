<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>docsify-yacv — build123d &amp; CAD models in docsify</title>
    <meta
      name="description"
      content="Yet Another CAD Viewer plugin for docsify with live in-browser build123d and static GLB/GLTF support."
    />
    <!-- Start DNS/TLS early for docsify (jsDelivr) and the yacv viewer. The
         plugin adds hints for the PyPI/OCP origins only on pages with live code. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://yeicor-3d.github.io" />
    <link rel="dns-prefetch" href="https://yeicor-3d.github.io" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2342b983'/%3E%3Cpath d='M32 13 51 23v18L32 51 13 41V23z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M13 23l19 10 19-10M32 33v18' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div id="app"></div>

    <!-- Plugin configuration (all optional) -->
    <script>
      const params = new URLSearchParams(window.location.search);

      window.$docsify = {
        name: 'docsify-yacv',
        repo: 'gllmAR/docsify-yacv',
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        yacv: {
          // The repo ships an optimized, headless viewer build (no Monaco,
          // drawers closed, faster Python bootstrap). `?viewer=...` overrides
          // it, e.g. to test the upstream viewer.
          viewer: params.get('viewer') || './viewer/',
          // "Open" uses the full upstream viewer so readers can edit code there.
          openViewer: 'https://yeicor-3d.github.io/yet-another-cad-viewer/',
          // One shared Python worker serves every live example on the page
          // (requires the same-origin ./viewer/ build). Run `npm run demo` or
          // open the GitHub Pages demo to try it.
          runtime: 'worker',
          workerUrl: './viewer/yacv-worker.js',
          version: 'stable',
          height: '460px',
          settings: {
            edgeWidth: 1,
            // The grid/axes helpers add a lot of geometry and can z-fight
            // with the model at close zoom; the orientation gizmo remains.
            loadHelpers: false,
          },
        },
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <!-- Optional: nicer Python highlighting for the source panels (the plugin
         uses window.Prism.languages.python when available). -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
    <!-- The plugin auto-registers itself with docsify. -->
    <script src="./docsify-yacv.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  </body>
</html>
