name: Deploy demo

# Static deployment only: this workflow copies the already-committed site files
# and publishes them. It does not install dependencies or run a build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage static files
        run: |
          mkdir -p _site/assets
          cp index.html README.md _sidebar.md build123d.md models.md reference.md \
             docsify-yacv.js LICENSE .nojekyll _site/
          cp assets/* _site/assets/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
