<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>docsify-yacv e2e</title>
    <link rel="stylesheet" href="/docsify-core.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: 'docsify-yacv e2e',
        basePath: '/',
        yacv: {
          runtime: 'viewer',
          viewer: '/viewer-stub.html',
          openViewer: '/viewer-stub.html?open=1',
          version: '0.9.1',
          lazy: true,
          unloadOffscreen: false,
          maxLiveConcurrent: 10,
        },
      };
    </script>
    <script src="/docsify.min.js"></script>
    <script src="/docsify-yacv.js"></script>
  </body>
</html>
